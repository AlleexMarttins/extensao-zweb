<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente Zweb</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header class="hero"><img src="../icons/icon128.png" width="42" height="42" alt=""><div><h1>Assistente Zweb</h1><p>Preferências da extensão</p></div><span id="extensionVersion" class="version"></span></header>
  <main>
    <div class="filter-bar"><label class="sr-only" for="featureSearch">Buscar opção</label><input id="featureSearch" type="search" placeholder="Buscar opção…" autocomplete="off"><div id="groupFilters" class="group-filters" role="group" aria-label="Filtrar por área"></div></div>
    <p id="featureStatus" role="status"></p><div class="feature-groups" id="featureGroups"></div><p id="featureEmpty" class="empty" hidden>Nenhuma opção encontrada.</p>
    <details class="local-settings"><summary>Casas decimais <span>Preferência local</span></summary><div class="decimal-content">
      <p class="local-settings-copy">Somente para o login desta aba.</p>
      <div class="decimal-grid"><div class="decimal-field"><label for="localDecimalQuantity">Quantidade</label><input id="localDecimalQuantity" type="number" min="2" max="4" step="1" inputmode="numeric"></div><div class="decimal-field"><label for="localDecimalPrice">Preço</label><input id="localDecimalPrice" type="number" min="2" max="10" step="1" inputmode="numeric"></div></div>
      <div class="decimal-actions"><button class="mini-btn primary" id="saveDecimalPrefs">Salvar</button><button class="mini-btn" id="resetDecimalPrefs">Usar padrão global</button></div><p class="decimal-status" id="decimalPrefsStatus" role="status"></p>
    </div></details>
  </main>
  <footer class="footer"><button class="primary-btn" id="reload">Recarregar página</button><button class="secondary-btn" id="openVisualSettings">Aparência</button><button class="secondary-btn" id="openLogs">Logs</button></footer>
  <script src="../nucleo/features.js"></script><script src="popup.js"></script>
</body></html>
